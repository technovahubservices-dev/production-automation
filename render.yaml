# Reference settings for the existing production-automation service.
services:
  - type: web
    name: production-automation
    runtime: node
    branch: master
    autoDeployTrigger: "off"
    # The backend imports shared/departments.json; recovery scripts also read frontend fixtures.
    rootDir: .
    buildCommand: npm --prefix backend ci --omit=dev
    startCommand: npm --prefix backend start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: BIOMETRIC_INTEGRATION_ENABLED
        value: "true"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BIOMETRIC_SERVICE_SECRET
        sync: false
